name: HIGHFLY P195 · WORLD FORGE 2.0 End-to-End
on:
  push:
    branches: [p195-world-forge-2-0-20261106]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm install --no-save three@0.180.0
      - name: Syntax, license provenance and retained regression suite
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s LICENSE && test -s PROVENANCE.md
          test -s editor.html && test -s index.html
          test -s src/editor/editor-environment-p195.js
          test -s src/world/central-town-p194.js
          test -s assets/models/player_barbarian.glb
          ! find src assets -type f \( -iname '*SOURCE*.zip' -o -iname '*CraftPix*' \) | grep -q .
          find src -name '*.js' -type f -print0 | while IFS= read -r -d '' file; do
            node --input-type=module --check < "$file"
          done
          node --check scripts/p195-browser-smoke.mjs
          node --experimental-default-type=module tests/p192-world-wiki-crafting.test.mjs
          node --experimental-default-type=module tests/p190-six-skills.test.mjs
          node --experimental-default-type=module tests/p191-ux-apprenticeship.test.mjs
          grep -q "prepareEditorEnvironmentP195(game)" src/main.js
          grep -q "applyFeatureLayoutP195" src/world/central-town-p194.js
          grep -q "WORLD_FORGE_DRAFT_KEY_P195" src/world/world-layout-p193.js
  browser:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Boot WebGL game and editor
        run: node server.mjs > /tmp/highfly-p195.log 2>&1 & echo $! > /tmp/highfly-p195.pid
      - name: Real browser E2E · 360 camera, sky, water, JSON and gameplay
        run: node scripts/p195-browser-smoke.mjs
      - name: Save screenshots and JSON report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p195-world-forge-v2-browser-proof
          path: |
            p195-forge-verification.json
            p195-editor-screenshot.png
          if-no-files-found: ignore
