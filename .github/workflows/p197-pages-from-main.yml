name: HIGHFLY · P197 World Forge 2.0 + Misiones ClaudeCraft
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/p197-pages-from-main.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: highfly-pages
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout immutable P197 experimental game
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 0f9c3cfd3af1d8ffc2df374722502ddf1e678450
          persist-credentials: false
      - name: Check complete source, three quests, editor, and license
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "0f9c3cfd3af1d8ffc2df374722502ddf1e678450"
          test -s index.html && test -s editor.html
          test -s LICENSE && test -s PROVENANCE.md
          test -s assets/models/player_barbarian.glb
          test -s src/world/claudecraft-quests-p197.js
          test -s src/world/town-visuals-p196.js
          test -s src/world/living-town-p196.js
          test -s src/editor/editor-environment-p195.js
          grep -q 'p197Build=true' src/main.js
          grep -q 'KEY_P197' src/systems/save.js
          grep -q 'cc_q_spiders' src/world/claudecraft-quests-p197.js
          ! find src assets -type f \( -iname '*SOURCE*.zip' -o -iname '*CraftPix*' \) | grep -q .
          find src -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --input-type=module --check < "$file"
          done
      - name: Verify ORIGINAL CC0 animated boar for published game
        run: bash scripts/fetch_gobkit_boar_p183b.sh
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Production root P192 pinned and protected
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 3a4aa2615bf3f0cff1958967865b18d39b9fe53b
          persist-credentials: false
      - name: Original P193 editor pinned and protected
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 3814935442c23b2fe055f6040e0dcc5e52150e59
          path: p193-source
          persist-credentials: false
      - name: Original P194 town pinned and protected
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 57889b92df8b693736397a5bddb3504c9b55a7e5
          path: p194-source
          persist-credentials: false
      - name: P197 editor + game pinned and isolated
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 0f9c3cfd3af1d8ffc2df374722502ddf1e678450
          path: p197-source
          persist-credentials: false
      - name: Install verified true CC0 boar into P197 only
        shell: bash
        run: |
          cd p197-source
          bash scripts/fetch_gobkit_boar_p183b.sh
      - name: Assemble DEDUPLICATED immutable editions with one shared CC0 asset library
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p .site .site/p193 .site/p194 .site/p197
          # The original P192 page keeps its exact document-relative paths.
          cp -a index.html styles.css LICENSE PROVENANCE.md src lib basis assets .site/
          # Confirmed SHA-identical model GLBs across P192/P193/P194/P197.
          # The only additional P197 asset is the independently audited CC0 boar.
          cp -a p197-source/assets/models/boar_gobkit_cc0.glb .site/assets/models/
          # Keep distinct executable source for all editions, but do NOT
          # replicate 30 MB of GLBs or 2 MB of Three.js in each folder.
          for edition in p193 p194 p197; do
            source_dir="${edition}-source"
            dest=".site/${edition}"
            mkdir -p "${dest}/assets"
            cp -a "${source_dir}/index.html" "${source_dir}/editor.html" \
              "${source_dir}/styles.css" "${source_dir}/LICENSE" \
              "${source_dir}/PROVENANCE.md" "${source_dir}/src" "${dest}/"
            # Each edition retains its OWN authored world layout JSON.
            cp -a "${source_dir}/assets/world-layout-p193.json" "${dest}/assets/"
            # HTML import maps share the exact same pinned local Three.js build.
            sed -i 's#\./lib/#../lib/#g' "${dest}/index.html" "${dest}/editor.html"
            # GLTF models and Basis decoder are only referenced by this loader.
            sed -i -e 's#\./assets/models/#../assets/models/#g' \
              -e 's#\./basis/#../basis/#g' "${dest}/src/core/assets.js"
            grep -Fq '../lib/three.module.js' "${dest}/index.html"
            grep -Fq '../lib/three.module.js' "${dest}/editor.html"
            grep -Fq '../assets/models/player_barbarian.glb' "${dest}/src/core/assets.js"
            grep -Fq '../basis/' "${dest}/src/core/assets.js"
            grep -Fq './assets/world-layout-p193.json' "${dest}/src/world/world-layout-p193.js"
            test -s "${dest}/assets/world-layout-p193.json"
          done
          touch .site/.nojekyll
          echo '3a4aa2615bf3f0cff1958967865b18d39b9fe53b' > .site/BUILD_P192.txt
          echo '3814935442c23b2fe055f6040e0dcc5e52150e59' > .site/p193/BUILD_P193.txt
          echo '57889b92df8b693736397a5bddb3504c9b55a7e5' > .site/p194/BUILD_P194.txt
          echo '0f9c3cfd3af1d8ffc2df374722502ddf1e678450' > .site/p197/BUILD_P197.txt
          test -s .site/assets/models/boar_gobkit_cc0.glb
          test -s .site/p197/editor.html
          test -s .site/p197/src/world/claudecraft-quests-p197.js
          # Fail closed if pack bloat accidentally returns: the full 4-edition
          # release should take less than 60 MiB unpacked, not 4 x 35 MiB.
          bytes=$(du -sb .site | cut -f1)
          echo "Pages publish size: ${bytes} bytes"
          test "$bytes" -lt 62914560
          test "$(find .site -name 'player_barbarian.glb' | wc -l)" -eq 1
          ! find .site -type f \( -iname '*SOURCE*.zip' -o -iname '*CraftPix*' \) | grep -q .
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          name: highfly-p197-pages-release
          path: .site
      - name: Deploy static FULL HIGHFLY RPG and World Forge 2.0
        uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: highfly-p197-pages-release
          timeout: 600000
