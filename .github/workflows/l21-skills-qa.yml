name: HIGHFLY L21 · FURY P16 + 3 bots + skills QA
on:
  push:
    branches:
      - p21-fury-skills-full-training-pages-20261105
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JS source, game and browser test syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          find src -name '*.js' -type f -print0 | while IFS= read -r -d '' file; do
            node --input-type=module --check < "$file"
          done
          node --check scripts/p21-browser-smoke.mjs
      - name: Preserve P5-P16 FURY + L21 skills contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          node tests/premium-hud.test.mjs
          node tests/p6-integral.test.mjs
          node tests/p7-fury.test.mjs
          node tests/p810-integral.test.mjs
          node tests/p812-polish.test.mjs
          node tests/p13-fury.test.mjs
          node tests/p14-air-chain.test.mjs
          node tests/p15-fury.test.mjs
          node tests/p15-finisher.test.mjs
          node tests/p15-interruption.test.mjs
          node tests/p16-hit-confirm.test.mjs
          node tests/p19-fury-skills.test.mjs
          node tests/p20-static-lab.test.mjs
      - name: Real GLB clips, license provenance, and non-commercial source check
        shell: bash
        run: |
          set -Eeuo pipefail
          node scripts/audit_animation_p6.mjs
          node scripts/p14-mountain-scan.mjs
          test -s LICENSE
          test -s PROVENANCE.md
          test -s assets/models/player_barbarian.glb
          ! find . -type f \( -iname '*SOURCE*.zip' -o -iname '*CraftPix*' \) | grep -q .
  browser-mobile:
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install disposable Chromium driver
        shell: bash
        run: |
          set -Eeuo pipefail
          printf '{"private":true,"type":"module"}\n' > package.json
          npm install --no-save --no-package-lock playwright-core@1.58.0
          command -v google-chrome || command -v chromium
      - name: Real WebGL browser QA under simulated Galaxy S23 landscape
        shell: bash
        run: |
          set -Eeuo pipefail
          # Mirrors the separate Pages root without committing over the demo.
          cp lab.html index.html
          python3 -m http.server 8957 --bind 127.0.0.1 >/tmp/hf-l21-server.log 2>&1 &
          HF_LAB_ENTRY=/index.html HF_CAPTURE=1 CHROME_PATH="$(command -v google-chrome || command -v chromium)" node scripts/p21-browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: highfly-L21-mobile-simulated
          path: audit-output/p21-mobile-landscape.png
          if-no-files-found: ignore
          retention-days: 7
# Does NOT publish or modify the original HIGHFLY Pages.
