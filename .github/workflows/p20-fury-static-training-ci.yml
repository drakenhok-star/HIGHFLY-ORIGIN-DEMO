name: HIGHFLY P20 - FURY P16 with 1-3 static training rigs (QA only)
on:
  push:
    branches:
      - p20-fury-p16-static-training-pages-20261105
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check first-party JS syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          find src -name '*.js' -type f -print0 | while IFS= read -r -d '' file; do
            node --input-type=module --check < "$file"
          done
          node --check scripts/p20-browser-smoke.mjs
      - name: Run P5-P16 existing FURY regressions plus P19-P20 skills
        shell: bash
        run: |
          set -Eeuo pipefail
          node tests/premium-hud.test.mjs
          node tests/p6-integral.test.mjs
          node tests/p7-fury.test.mjs
          node tests/p810-integral.test.mjs
          node tests/p812-polish.test.mjs
          node tests/p13-fury.test.mjs
          node tests/p14-air-chain.test.mjs
          node tests/p15-fury.test.mjs
          node tests/p15-finisher.test.mjs
          node tests/p15-interruption.test.mjs
          node tests/p16-hit-confirm.test.mjs
          node tests/p19-fury-skills.test.mjs
          node tests/p20-static-lab.test.mjs
      - name: Animation audit, provenance and licence checks
        shell: bash
        run: |
          set -Eeuo pipefail
          node scripts/audit_animation_p6.mjs
          node scripts/p14-mountain-scan.mjs
          test -s LICENSE
          test -s PROVENANCE.md
          test -s assets/models/player_barbarian.glb
          ! find . -type f \( -iname '*SOURCE*.zip' -o -iname '*CraftPix*' \) | grep -q .
  mobile-browser-sim:
    needs: source-and-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser in disposable GitHub runner
        shell: bash
        run: |
          set -Eeuo pipefail
          printf '{"type":"module","private":true}\n' > package.json
          npm install --no-save --no-package-lock playwright-core@1.58.0
          command -v google-chrome || command -v chromium
      - name: Smoke FURY, static training, skills, camera in 915x412 viewport
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m http.server 8957 --bind 127.0.0.1 >/tmp/p20-server.log 2>&1 &
          HF_CAPTURE=1 CHROME_PATH="$(command -v google-chrome || command -v chromium)" node scripts/p20-browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p20-static-skills-mobile-preview
          path: audit-output/p20-mobile-landscape.png
          if-no-files-found: ignore
          retention-days: 7
# No Pages deployment. Never modifies main nor the HIGHFLY public Pages site.
