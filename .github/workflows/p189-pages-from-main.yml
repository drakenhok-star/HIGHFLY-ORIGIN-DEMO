name: HIGHFLY · Publicar P189 desde main sin fusionar gameplay
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/p189-pages-from-main.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "highfly-pages"
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout immutable P189 verified source, NOT main gameplay
        uses: actions/checkout@v4
        with:
          ref: b8278ad676a703a5191dbdf0ec0af450f35c212b
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check pinned commit, provenance, world, Fury and new quick menu
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "b8278ad676a703a5191dbdf0ec0af450f35c212b"
          test -s LICENSE && test -s PROVENANCE.md
          test -s index.html && test -s styles.css
          test -s assets/manifest.json
          test -s assets/models/player_barbarian.glb
          test -s lib/three.module.js
          test -s src/ui/quick-nav-p187.js
          test -s src/combat/skill-bridge-p186.js
          test -s src/combat/aim-preview-p188.js
          test -s src/skillslab/aim-guide-p16.js
          test -s src/combat/l27-aim-adapter-p189.js
          test -s src/combat/skill-progression-p188.js
          test -s src/ui/rpg-books-p188.js
          test -s src/ui/gpu-diagnostics-p188.js
          test -s src/world/inicios-v2-p186.js
          test -s src/world/world-zones-p185.js
          ! find src -type f \( -iname '*SOURCE*.zip' -o -iname '*CraftPix*' \) | grep -q .
          find src -name '*.js' -type f -print0 | while IFS= read -r -d '' f; do
            node --input-type=module --check < "$f"
          done
          node --experimental-default-type=module tests/p185-world-portals.test.mjs
          node --experimental-default-type=module tests/p186-inicios-v2.test.mjs
          node --experimental-default-type=module tests/p186-skill-transfer.test.mjs
          node --experimental-default-type=module tests/p187-integrated-contracts.test.mjs
          node --experimental-default-type=module tests/p188-skill-progression.test.mjs
          node --experimental-default-type=module tests/p189-l27-aim-hud.test.mjs
          node tests/premium-hud.test.mjs

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    timeout-minutes: 20
    steps:
      - name: Checkout pinned P189 (main source remains untouched)
        uses: actions/checkout@v4
        with:
          ref: b8278ad676a703a5191dbdf0ec0af450f35c212b
          persist-credentials: false
      - name: Assemble project-relative Pages static site
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p .site
          cp -a index.html styles.css LICENSE PROVENANCE.md src lib assets .site/
          touch .site/.nojekyll
          printf "P189 Inicios + FURY (commit %s)\n" "b8278ad676a703a5191dbdf0ec0af450f35c212b" > .site/BUILD_P189.txt
          test -s .site/src/ui/quick-nav-p187.js
          test -s .site/src/combat/skill-bridge-p186.js
          test -s .site/src/combat/aim-preview-p188.js
          test -s .site/src/skillslab/aim-guide-p16.js
          test -s .site/src/combat/l27-aim-adapter-p189.js
          test -s .site/src/ui/rpg-books-p188.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .site
      - name: Deploy verified P189 to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment
