name: HIGHFLY P194 · Central Village + World Forge browser checks
on:
  push:
    branches: [p194-central-village-forge-20261106]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm install --no-save three@0.180.0
      - name: License guard, assets and JavaScript syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s LICENSE && test -s PROVENANCE.md
          test -s editor.html && test -s index.html
          test -s src/world/central-town-p194.js
          test -s src/editor/world-editor-p193.js
          test -s assets/models/player_barbarian.glb
          ! find src assets -type f \( -iname '*SOURCE*.zip' -o -iname '*CraftPix*' \) | grep -q .
          find src -name '*.js' -type f -print0 | while IFS= read -r -d '' f; do
            node --input-type=module --check < "$f"
          done
          node --check scripts/p194-browser-smoke.mjs
          node --experimental-default-type=module tests/p192-world-wiki-crafting.test.mjs
          node --experimental-default-type=module tests/p190-six-skills.test.mjs
          node --experimental-default-type=module tests/p191-ux-apprenticeship.test.mjs
      - name: Build review
        run: |
          test -f assets/world-layout-p193.json
          grep -q "installCentralTownP194(game)" src/main.js
          grep -q "g.p194CentralTown" src/world/hamlets-p192.js

  browser:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Start actual game server
        run: node server.mjs > /tmp/p194-server.log 2>&1 & echo $! > /tmp/p194-server.pid
      - name: Browser test real scene, professions and frame loop
        run: node scripts/p194-browser-smoke.mjs
      - name: Upload actual P194 viewport screenshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p194-real-browser-scene
          path: |
            p194-world-forge.png
            p194-world-forge.json
          if-no-files-found: ignore
