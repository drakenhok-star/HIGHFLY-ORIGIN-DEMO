name: "HIGHFLY P18.4 · Premium Crypt Blueprint CI"
on:
  push:
    branches:
      - p184-premium-crypt-blueprint-20261105
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate all JS syntax and old/new regression tests
        shell: bash
        run: |
          set -Eeuo pipefail
          find src -type f -name '*.js' -print0 | while IFS= read -r -d '' f; do
            node --input-type=module --check < "$f"
          done
          for t in tests/*.test.mjs; do node "$t"; done
