name: HIGHFLY ORIGIN · Deploy updated public game

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "styles.css"
      - "src/**"
      - "lib/**"
      - "assets/**"
      - "tests/**"
      - ".github/workflows/deploy-live.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "highfly-pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: github-pages
    timeout-minutes: 20
    steps:
      - name: Checkout current public game
        uses: actions/checkout@v4

      - name: Validate public game content
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f LICENSE
          test -f index.html
          test -f assets/manifest.json
          test -f assets/models/player_barbarian.glb
          node --input-type=module --check < src/main.js
          node --input-type=module --check < src/ui/touch-controls.js
          node --input-type=module --check < src/ui/premium-hud-p5.js
          node tests/premium-hud.test.mjs
          echo "OK: juego público y HUD premium verificables"

      - name: Prepare static Pages site from current source
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p .site
          cp -a index.html styles.css LICENSE PROVENANCE.md src lib assets .site/
          touch .site/.nojekyll

      - name: Add P6 playable preview beside stable Pages build (public assets only)
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags --depth=1 origin refs/heads/p6-integral-combate-20261104
          mkdir -p .site/p6
          git archive FETCH_HEAD index.html styles.css LICENSE PROVENANCE.md src lib assets | tar -x -C .site/p6
          test -s .site/p6/index.html
          test -s .site/p6/src/combat/targeting-p6.js
          test -s .site/p6/assets/models/player_barbarian.glb
          node --input-type=module --check < .site/p6/src/main.js
          node --input-type=module --check < .site/p6/src/combat/combat.js
          echo "Pages stable: / ; P6 preview: /p6/ (main gameplay unchanged)"

      - name: Add P7 FURY 360 playable preview with premium equipment (stable and P6 preserved)
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags --depth=1 origin refs/heads/p7-fury-360-combat-20261104
          test "$(git rev-parse FETCH_HEAD)" = "55c631cc39dae9b8fb4aab819bf8176ea62d6fc9"
          mkdir -p .site/p7
          git archive FETCH_HEAD index.html styles.css LICENSE PROVENANCE.md src lib assets | tar -x -C .site/p7
          test -s .site/p7/index.html
          test -s .site/p7/src/ui/inventory-p7.js
          test -s .site/p7/src/combat/motion-p7.js
          test -s .site/p7/src/world/obstacles-p7.js
          test -s .site/p7/assets/models/player_barbarian.glb
          find .site/p7/src -name '*.js' -type f -print0 | while IFS= read -r -d '' file; do
            node --input-type=module --check < "$file"
          done
          echo "P7 checked: 55c631cc39dae9b8fb4aab819bf8176ea62d6fc9"
          echo "Public: / stable · /p6 prior · /p7 FURY 360"

      - name: Add CI-green integrated P8 P9 P10 playtest (preserve stable P6 P7)
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags --depth=1 origin refs/heads/p8-p9-p10-fury-ui-editor-20261104
          test "$(git rev-parse FETCH_HEAD)" = "25d5a421521aef6172a8b5a0efb0a03db77c811b"
          mkdir -p .site/p810
          git archive FETCH_HEAD index.html styles.css LICENSE PROVENANCE.md src lib assets | tar -x -C .site/p810
          test -s .site/p810/index.html
          test -s .site/p810/src/ui/p810-ui.js
          test -s .site/p810/src/ui/p9-panels.js
          test -s .site/p810/src/ui/p10-hud-editor.js
          test -s .site/p810/src/combat/combat.js
          test -s .site/p810/assets/models/player_barbarian.glb
          find .site/p810/src -name '*.js' -type f -print0 | while IFS= read -r -d '' file; do
            node --input-type=module --check < "$file"
          done
          if find .site/p810 -type f \( -iname '*SOURCE*.zip' -o -iname '*CraftPix*' \) | grep -q .; then
            echo "Restricted media detected"; exit 1
          fi
          echo "P810 preview pinned to 25d5a421521aef6172a8b5a0efb0a03db77c811b"
          echo "Public site: / stable · /p6 · /p7 · /p810"

      - name: Add CI-approved P812 FURY polish preview (preserve stable P6 P7 P810)
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags --depth=1 origin refs/heads/p812-fury-polish-20261104
          test "$(git rev-parse FETCH_HEAD)" = "c57d29353bee3b391ab233f2a56ea867f3190c76"
          mkdir -p .site/p812
          git archive FETCH_HEAD index.html styles.css LICENSE PROVENANCE.md src lib assets | tar -x -C .site/p812
          test -s .site/p812/index.html
          test -s .site/p812/src/ui/p812-polish.js
          test -s .site/p812/src/ui/p10-hud-editor.js
          test -s .site/p812/src/ui/world-map-p34.js
          test -s .site/p812/src/combat/combat.js
          test -s .site/p812/assets/models/player_barbarian.glb
          find .site/p812/src -name '*.js' -type f -print0 | while IFS= read -r -d '' file; do
            node --input-type=module --check < "$file"
          done
          if find .site/p812 -type f \( -iname '*SOURCE*.zip' -o -iname '*CraftPix*' \) | grep -q .; then
            echo "Restricted material detected"; exit 1
          fi
          echo "P812 pinned CI-green c57d29353bee3b391ab233f2a56ea867f3190c76"
          echo "Pages: stable / · /p6/ · /p7/ · /p810/ · /p812/"

      - name: Add P13 FURY playable parkour (preserve stable and prior versions)
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags --depth=1 origin refs/heads/p13-fury-movement-engine-20261104
          test "$(git rev-parse FETCH_HEAD)" = "1890b3ac1644429fedc98cc96406c1519d732793"
          mkdir -p .site/p13
          git archive FETCH_HEAD index.html styles.css LICENSE PROVENANCE.md src lib assets | tar -x -C .site/p13
          test -s .site/p13/index.html
          test -s .site/p13/src/player/fury-surfaces-p13.js
          test -s .site/p13/src/player/fury-traversal-p13.js
          test -s .site/p13/src/world/obstacles-p7.js
          test -s .site/p13/src/combat/combat.js
          test -s .site/p13/assets/models/player_barbarian.glb
          find .site/p13/src -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --input-type=module --check < "$file"
          done
          if find .site/p13 -type f \( -iname '*SOURCE*.zip' -o -iname '*CraftPix*' \) | grep -q .; then
            echo "Restricted material detected"; exit 1
          fi
          echo "P13 pinned to verified green commit 1890b3ac1644429fedc98cc96406c1519d732793"
          echo "Pages: / stable · /p6/ · /p7/ · /p810/ · /p812/ · /p13/"

      - name: Add P14 FURY Air Chain mobile game (pin verified commit, preserve prior versions)
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags --depth=1 origin refs/heads/p14-fury-air-chain-20261104
          test "$(git rev-parse FETCH_HEAD)" = "e8d0dcbccf86aaee2380e1da3e27b3d8e8a1bbce"
          mkdir -p .site/p14
          git archive FETCH_HEAD index.html styles.css LICENSE PROVENANCE.md src lib assets | tar -x -C .site/p14
          test -s .site/p14/index.html
          test -s .site/p14/src/combat/air-chain-p14.js
          test -s .site/p14/src/player/fury-traversal-p13.js
          test -s .site/p14/src/ui/p14-polish.js
          test -s .site/p14/assets/models/player_barbarian.glb
          find .site/p14/src -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --input-type=module --check < "$file"
          done
          if find .site/p14 -type f \( -iname '*SOURCE*.zip' -o -iname '*CraftPix*' \) | grep -q .; then
            echo "Restricted assets detected"; exit 1
          fi
          echo "P14 pinned to CI-green commit e8d0dcbccf86aaee2380e1da3e27b3d8e8a1bbce"
          echo "Paths kept: /, /p6/, /p7/, /p810/, /p812/, /p13/, /p14/"

      - name: Add P15 FURY Combat Evolution and directional fourth hit preview (keep older paths)
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags --depth=1 origin refs/heads/p15-fury-combat-evolution-20261104
          test "$(git rev-parse FETCH_HEAD)" = "768dd202c95da57f9b6c02e06a5d8d0a251203d1"
          mkdir -p .site/p15
          git archive FETCH_HEAD index.html styles.css LICENSE PROVENANCE.md src lib assets | tar -x -C .site/p15
          test -s .site/p15/index.html
          test -s .site/p15/src/combat/fury-combat-p15.js
          test -s .site/p15/src/combat/fury-finisher-p15.js
          test -s .site/p15/src/player/fury-traversal-p13.js
          test -s .site/p15/src/ui/p14-polish.js
          test -s .site/p15/assets/models/player_barbarian.glb
          find .site/p15/src -name '*.js' -type f -print0 | while IFS= read -r -d '' f; do
            node --input-type=module --check < "$f"
          done
          if find .site/p15 -type f \( -iname '*SOURCE*.zip' -o -iname '*CraftPix*' \) | grep -q .; then
            echo "Restricted assets detected"; exit 1
          fi
          echo "P15 published from SHA 768dd202c95da57f9b6c02e06a5d8d0a251203d1, CI verified"
          echo "Previous /, /p6/, /p7/, /p810/, /p812/, /p13/, /p14/ untouched"

      - name: Add CI-green P16 FURY Hit Confirm + Responsive Joystick (keep P15 and prior demos)
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags --depth=1 origin refs/heads/p16-fury-hitconfirm-20261105
          test "$(git rev-parse FETCH_HEAD)" = "a83e7993d84da33c8d0792277c08d69a56bd1906"
          mkdir -p .site/p16
          git archive FETCH_HEAD index.html styles.css LICENSE PROVENANCE.md src lib assets | tar -x -C .site/p16
          test -s .site/p16/index.html
          test -s .site/p16/src/combat/hit-confirm-p16.js
          test -s .site/p16/src/combat/combat.js
          test -s .site/p16/src/ui/touch-controls.js
          test -s .site/p16/src/player/player.js
          test -s .site/p16/assets/models/player_barbarian.glb
          find .site/p16/src -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --input-type=module --check < "$file"
          done
          if find .site/p16 -type f \( -iname '*SOURCE*.zip' -o -iname '*CraftPix*' \) | grep -q .; then
            echo "Restricted material found"; exit 1
          fi
          echo "P16 pinned to CI-green commit a83e7993d84da33c8d0792277c08d69a56bd1906"
          echo "Preserved stable and /p6/ /p7/ /p810/ /p812/ /p13/ /p14/ /p15/"

      - name: Add P16.1 Performance + Training (P16 frozen, Skill Lab separate)
        shell: bash
        run: |
          set -Eeuo pipefail
          # Pin immutable approved source, never publish moving branch head.
          git fetch --no-tags --depth=1 origin refs/heads/p16-1-performance-foundation-20261105
          test "$(git rev-parse FETCH_HEAD)" = "de853a300416d4ac72a5e4d8279af410be3288ef"
          mkdir -p .p161-validate .site/p161
          git archive FETCH_HEAD index.html styles.css LICENSE PROVENANCE.md src lib assets tests scripts docs | tar -x -C .p161-validate
          cd .p161-validate
          test -s index.html
          test -s src/combat/hit-confirm-p16.js
          test -s src/ui/performance-p161.js
          test -s src/world/grass-cursor-p161.js
          test -s src/world/terrain.js
          test -s src/ui/training-p161.js
          test -s src/ui/training-p161.css
          test -s src/ui/training-schedule-p161.js
          test -s assets/models/player_barbarian.glb
          find src -name '*.js' -type f -print0 | while IFS= read -r -d '' file; do
            node --input-type=module --check < "$file"
          done
          node tests/premium-hud.test.mjs
          node tests/p6-integral.test.mjs
          node tests/p7-fury.test.mjs
          node tests/p810-integral.test.mjs
          node tests/p812-polish.test.mjs
          node tests/p13-fury.test.mjs
          node tests/p14-air-chain.test.mjs
          node tests/p15-fury.test.mjs
          node tests/p15-finisher.test.mjs
          node tests/p15-interruption.test.mjs
          node tests/p16-hit-confirm.test.mjs
          node tests/p161-performance.test.mjs
          node tests/p161-grass-budget.test.mjs
          node tests/p161-terrain-budget.test.mjs
          node tests/p161-training-ui.test.mjs
          node scripts/p14-mountain-scan.mjs
          node scripts/audit_animation_p6.mjs
          if find . -type f \( -iname '*SOURCE*.zip' -o -iname '*CraftPix*' \) | grep -q .; then
            echo "P16.1 contains restricted assets"; exit 1
          fi
          cp -a index.html styles.css LICENSE PROVENANCE.md src lib assets ../.site/p161/
          cd ..
          touch .site/p161/.nojekyll
          test -s .site/p161/index.html
          test -s .site/p16/index.html
          echo "P16 backup remains pinned to a83e7993d84da33c8d0792277c08d69a56bd1906"
          echo "P16.1 Performance + Training: /p161/ pinned de853a300416d4ac72a5e4d8279af410be3288ef"
          echo "Skill Lab and other repositories untouched."

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .site

      - name: Publish updated game
        id: deployment
        uses: actions/deploy-pages@v4
