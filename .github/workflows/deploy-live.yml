name: HIGHFLY ORIGIN · Deploy updated public game

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "styles.css"
      - "src/**"
      - "lib/**"
      - "assets/**"
      - "tests/**"
      - ".github/workflows/deploy-live.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "highfly-pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: github-pages
    timeout-minutes: 20
    steps:
      - name: Checkout current public game
        uses: actions/checkout@v4

      - name: Validate public game content
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f LICENSE
          test -f index.html
          test -f assets/manifest.json
          test -f assets/models/player_barbarian.glb
          node --input-type=module --check < src/main.js
          node --input-type=module --check < src/ui/touch-controls.js
          node --input-type=module --check < src/ui/premium-hud-p5.js
          node tests/premium-hud.test.mjs
          echo "OK: juego público y HUD premium verificables"

      - name: Prepare static Pages site from current source
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p .site
          cp -a index.html styles.css LICENSE PROVENANCE.md src lib assets .site/
          touch .site/.nojekyll

      - name: Add P6 playable preview beside stable Pages build (public assets only)
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags --depth=1 origin refs/heads/p6-integral-combate-20261104
          mkdir -p .site/p6
          git archive FETCH_HEAD index.html styles.css LICENSE PROVENANCE.md src lib assets | tar -x -C .site/p6
          test -s .site/p6/index.html
          test -s .site/p6/src/combat/targeting-p6.js
          test -s .site/p6/assets/models/player_barbarian.glb
          node --input-type=module --check < .site/p6/src/main.js
          node --input-type=module --check < .site/p6/src/combat/combat.js
          echo "Pages stable: / ; P6 preview: /p6/ (main gameplay unchanged)"

      - name: Add P7 FURY 360 playable preview with premium equipment (stable and P6 preserved)
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags --depth=1 origin refs/heads/p7-fury-360-combat-20261104
          test "$(git rev-parse FETCH_HEAD)" = "55c631cc39dae9b8fb4aab819bf8176ea62d6fc9"
          mkdir -p .site/p7
          git archive FETCH_HEAD index.html styles.css LICENSE PROVENANCE.md src lib assets | tar -x -C .site/p7
          test -s .site/p7/index.html
          test -s .site/p7/src/ui/inventory-p7.js
          test -s .site/p7/src/combat/motion-p7.js
          test -s .site/p7/src/world/obstacles-p7.js
          test -s .site/p7/assets/models/player_barbarian.glb
          find .site/p7/src -name '*.js' -type f -print0 | while IFS= read -r -d '' file; do
            node --input-type=module --check < "$file"
          done
          echo "P7 checked: 55c631cc39dae9b8fb4aab819bf8176ea62d6fc9"
          echo "Public: / stable · /p6 prior · /p7 FURY 360"

      - name: Add CI-green integrated P8 P9 P10 playtest (preserve stable P6 P7)
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags --depth=1 origin refs/heads/p8-p9-p10-fury-ui-editor-20261104
          test "$(git rev-parse FETCH_HEAD)" = "25d5a421521aef6172a8b5a0efb0a03db77c811b"
          mkdir -p .site/p810
          git archive FETCH_HEAD index.html styles.css LICENSE PROVENANCE.md src lib assets | tar -x -C .site/p810
          test -s .site/p810/index.html
          test -s .site/p810/src/ui/p810-ui.js
          test -s .site/p810/src/ui/p9-panels.js
          test -s .site/p810/src/ui/p10-hud-editor.js
          test -s .site/p810/src/combat/combat.js
          test -s .site/p810/assets/models/player_barbarian.glb
          find .site/p810/src -name '*.js' -type f -print0 | while IFS= read -r -d '' file; do
            node --input-type=module --check < "$file"
          done
          if find .site/p810 -type f \( -iname '*SOURCE*.zip' -o -iname '*CraftPix*' \) | grep -q .; then
            echo "Restricted media detected"; exit 1
          fi
          echo "P810 preview pinned to 25d5a421521aef6172a8b5a0efb0a03db77c811b"
          echo "Public site: / stable · /p6 · /p7 · /p810"

