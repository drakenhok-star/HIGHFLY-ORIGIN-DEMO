name: HIGHFLY · Publicar P194 Pueblo Central en Pages sin tocar P192 ni P193
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/p194-pages-from-main.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "highfly-pages"
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout immutable P194 reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 57889b92df8b693736397a5bddb3504c9b55a7e5
          persist-credentials: false
      - name: Check safe P194 website, original quests and exact reviewed commit
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "57889b92df8b693736397a5bddb3504c9b55a7e5"
          test -s index.html && test -s editor.html
          test -s LICENSE && test -s PROVENANCE.md
          test -s lib/three.module.js && test -s assets/models/player_barbarian.glb
          test -s assets/manifest.json && test -s assets/world-layout-p193.json
          test -s src/world/central-town-p194.js && test -s src/world/hamlets-p192.js
          test -s docs/P194_CENTRAL_VILLAGE_WORLD_FORGE.md
          grep -q "prewarmCentralEditorP194" src/main.js
          grep -q "installCentralTownP194" src/main.js
          ! find src assets -type f \( -iname '*SOURCE*.zip' -o -iname '*CraftPix*' \) | grep -q .
          find src -name '*.js' -type f -print0 | while IFS= read -r -d '' f; do
            node --input-type=module --check < "$f"
          done

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    timeout-minutes: 25
    steps:
      - name: Checkout pinned P192 (production root stays exactly the same)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 3a4aa2615bf3f0cff1958967865b18d39b9fe53b
          persist-credentials: false
      - name: Checkout pinned P193 preserved editor
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 3814935442c23b2fe055f6040e0dcc5e52150e59
          path: p193-source
          persist-credentials: false
      - name: Checkout reviewed P194 central town
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 57889b92df8b693736397a5bddb3504c9b55a7e5
          path: p194-source
          persist-credentials: false
      - name: Three independent public Pages folders, no proprietary SOURCE media
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p .site .site/p193 .site/p194
          cp -a index.html styles.css LICENSE PROVENANCE.md src lib assets .site/
          cp -a p193-source/index.html p193-source/editor.html p193-source/styles.css \
            p193-source/LICENSE p193-source/PROVENANCE.md p193-source/src \
            p193-source/lib p193-source/assets .site/p193/
          cp -a p194-source/index.html p194-source/editor.html p194-source/styles.css \
            p194-source/LICENSE p194-source/PROVENANCE.md p194-source/src \
            p194-source/lib p194-source/assets .site/p194/
          touch .site/.nojekyll
          printf "P192 production commit 3a4aa2615bf3f0cff1958967865b18d39b9fe53b\n" > .site/BUILD_P192.txt
          printf "P193 original commit 3814935442c23b2fe055f6040e0dcc5e52150e59\n" > .site/p193/BUILD_P193.txt
          printf "P194 central village commit 57889b92df8b693736397a5bddb3504c9b55a7e5\n" > .site/p194/BUILD_P194.txt
          test -s .site/index.html
          test -s .site/p193/editor.html && test -s .site/p193/src/editor/world-editor-p193.js
          test -s .site/p194/editor.html && test -s .site/p194/src/world/central-town-p194.js
          ! find .site -type f \( -iname '*SOURCE*.zip' -o -iname '*CraftPix*' \) | grep -q .
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .site
      - name: Publish distinct P192, P193 and P194 builds
        uses: actions/deploy-pages@v4
        id: deployment
        with:
          timeout: 900000
