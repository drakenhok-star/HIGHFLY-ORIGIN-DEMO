name: "HIGHFLY P18.3d · Prairie REUSE-FIRST CI"
on:
  push:
    branches: [p183d-prairie-reuse-first-20261105]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch verified Gobkit CC0 boar (no proprietary source files)
        run: bash scripts/fetch_gobkit_boar_p183b.sh
      - name: Syntax & all regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          find src -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --input-type=module --check < "$file"
          done
          export HF_REQUIRE_BOAR=1
          for t in tests/*.test.mjs; do node "$t"; done
      - name: License exclusions
        run: |
          if find . -type f \( -iname '*CraftPix*' -o -iname '*Meshy*' -o -iname '*SOURCE*.zip' \) | grep -q .; then exit 1; fi
