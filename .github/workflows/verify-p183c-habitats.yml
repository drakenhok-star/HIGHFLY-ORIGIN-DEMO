name: "HIGHFLY P18.3c · REAL BIOMES AND RADAR CI"
on:
  push:
    branches: [p183c-habitats-radar-world-20261105]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch pinned CC0 Gobkit boar
        run: bash scripts/fetch_gobkit_boar_p183b.sh
      - name: All game regressions, real terrain and radar tests
        shell: bash
        run: |
          set -Eeuo pipefail
          find src -name '*.js' -print0 | while IFS= read -r -d '' file; do node --input-type=module --check < "$file"; done
          export HF_REQUIRE_BOAR=1
          for t in tests/*.test.mjs; do node "$t"; done
      - name: Restricted assets guard
        shell: bash
        run: |
          if find . -type f \( -iname '*SOURCE*.zip' -o -iname '*CraftPix*' -o -iname '*Sketchfab*' \) | grep -q .; then exit 1; fi
