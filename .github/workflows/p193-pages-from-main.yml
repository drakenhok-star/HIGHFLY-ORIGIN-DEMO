name: HIGHFLY · Publicar editor P193 en /p193/ sin tocar demo P192
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/p193-pages-from-main.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "highfly-pages"
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout immutable P193 world-editor
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 3814935442c23b2fe055f6040e0dcc5e52150e59
          persist-credentials: false
      - name: Verify P193 editor is based on P192 and contains no SOURCE packs
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "3814935442c23b2fe055f6040e0dcc5e52150e59"
          test -s index.html && test -s editor.html
          test -s LICENSE && test -s PROVENANCE.md && test -s assets/manifest.json
          test -s assets/models/player_barbarian.glb
          test -s src/editor/world-editor-p193.js
          test -s src/world/world-layout-p193.js
          test -s assets/world-layout-p193.json
          test -s src/world/hamlets-p192.js
          for f in src/main.js src/editor/world-editor-p193.js src/world/world-layout-p193.js src/world/hamlets-p192.js; do
            node --input-type=module --check < "$f"
          done
          ! find assets src -type f \( -iname '*SOURCE*.zip' -o -iname '*CraftPix*' \) | grep -q .
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const doc=JSON.parse(fs.readFileSync('assets/world-layout-p193.json','utf8'));
          assert.equal(doc.schemaVersion,193);
          assert.equal(doc.worldId,'village_01');
          assert.deepEqual(doc.added,[]);
          console.log('P193 layout safety verified');
          NODE

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    timeout-minutes: 20
    steps:
      - name: Checkout immutable P192 for the unchanged root game
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 3a4aa2615bf3f0cff1958967865b18d39b9fe53b
          persist-credentials: false
      - name: Checkout immutable P193 separately
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 3814935442c23b2fe055f6040e0dcc5e52150e59
          path: p193-source
          persist-credentials: false
      - name: Preserve P192 as site root, add full world editor under /p193/
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p .site .site/p193
          cp -a index.html styles.css LICENSE PROVENANCE.md src lib assets .site/
          cp -a p193-source/index.html p193-source/editor.html p193-source/styles.css \
            p193-source/LICENSE p193-source/PROVENANCE.md \
            p193-source/src p193-source/lib p193-source/assets .site/p193/
          touch .site/.nojekyll .site/p193/.nojekyll
          printf "P192 unchanged root: 3a4aa2615bf3f0cff1958967865b18d39b9fe53b\n" > .site/BUILD_P192.txt
          printf "P193 isolated editor: 3814935442c23b2fe055f6040e0dcc5e52150e59\n" > .site/p193/BUILD_P193.txt
          test -s .site/index.html
          test -s .site/p193/editor.html
          test -s .site/p193/src/editor/world-editor-p193.js
          test -s .site/p193/assets/world-layout-p193.json
          test -s .site/src/world/hamlets-p192.js
          ! find .site -type f \( -iname '*SOURCE*.zip' -o -iname '*CraftPix*' \) | grep -q .
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .site
      - name: Publish P192 root plus P193 independent editor
        uses: actions/deploy-pages@v4
        id: deployment
        with:
          timeout: 900000
