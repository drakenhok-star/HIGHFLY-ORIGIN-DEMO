name: HIGHFLY P15 · FURY Combat Evolution + Android Regression
on:
  push:
    branches: [p15-fury-combat-evolution-20261104]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check all first-party game modules
        shell: bash
        run: |
          set -Eeuo pipefail
          find src -name '*.js' -type f -print0 | while IFS= read -r -d '' file; do
            node --input-type=module --check < "$file"
          done
      - name: P5 through P14 regression suite
        shell: bash
        run: |
          set -Eeuo pipefail
          node tests/premium-hud.test.mjs
          node tests/p6-integral.test.mjs
          node tests/p7-fury.test.mjs
          node tests/p810-integral.test.mjs
          node tests/p812-polish.test.mjs
          node tests/p13-fury.test.mjs
          node tests/p14-air-chain.test.mjs
          node tests/p15-fury.test.mjs
      - name: Scan mountain heightfield for real parkour exploration
        run: node scripts/p14-mountain-scan.mjs
      - name: Validate source glTF animations and private kit safety
        shell: bash
        run: |
          set -Eeuo pipefail
          node scripts/audit_animation_p6.mjs
          test -s LICENSE
          test -s PROVENANCE.md
          test -s src/combat/fury-combat-p15.js
          test -s docs/skills/claudecraft_0447_410.csv
          test -s docs/skills/externas_100.csv
          ! find . -type f \( -iname '*SOURCE*.zip' -o -iname '*CraftPix*' \) | grep -q .
  mobile-browser:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Android-landscape driver in disposable GitHub runner
        shell: bash
        run: |
          set -Eeuo pipefail
          printf '{"private":true,"type":"module"}\n' > package.json
          npm install --no-save --no-package-lock playwright-core@1.58.0
          command -v google-chrome || command -v chromium
      - name: Smoke world, combo HUD, backpack, editor, quests, isolated P14 save
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m http.server 8957 --bind 127.0.0.1 > /tmp/p14-http.log 2>&1 &
          CHROME_PATH="$(command -v google-chrome || command -v chromium)" node scripts/p810-browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: highfly-p14-mobile-optional
          path: audit-output/p810-mobile-landscape.png
          if-no-files-found: ignore
          retention-days: 7
