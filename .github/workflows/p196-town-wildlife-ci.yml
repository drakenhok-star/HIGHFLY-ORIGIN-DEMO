name: HIGHFLY P196 · Living Village + 3x5 Wildlife + World Forge
on:
  push:
    branches: [p196-living-village-wildlife-20261106]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm install --no-save three@0.180.0
      - name: Verify all JS, ownership, saves and legacy tests
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s LICENSE && test -s PROVENANCE.md
          test -s editor.html && test -s index.html && test -s assets/manifest.json
          test -s docs/P196_QUESTS_PROFESSIONS_NPC_AUDIT.md
          test -s src/world/living-town-p196.js && test -s src/world/wilderness-spots-p196.js
          test -s src/world/town-visuals-p196.js && test -s src/editor/spawn-markers-p196.js
          ! find src assets -type f \( -iname '*SOURCE*.zip' -o -iname '*CraftPix*' \) | grep -q .
          find src -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --input-type=module --check < "$file"
          done
          node --check scripts/p195-browser-smoke.mjs
          node --experimental-default-type=module tests/p192-world-wiki-crafting.test.mjs
          node --experimental-default-type=module tests/p190-six-skills.test.mjs
          node --experimental-default-type=module tests/p191-ux-apprenticeship.test.mjs
          node --experimental-default-type=module tests/p196-town-wilderness.test.mjs
  browser:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Boot actual complete RPG and World Forge
        run: node server.mjs > /tmp/p196-server.log 2>&1 & echo $! > /tmp/p196-server.pid
      - name: Verify editor orbit, 13 safe trainers, readable signs, 15 monsters and game layout transfer
        run: node scripts/p195-browser-smoke.mjs
      - name: Retain screenshots and detailed test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p196-world-forge-real-browser-proof
          path: |
            p195-forge-verification.json
            p195-editor-screenshot.png
          if-no-files-found: ignore
